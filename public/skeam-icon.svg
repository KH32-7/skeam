<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.37 -1.54 64.84 64.84">
  <defs>
    <radialGradient id="disc" cx="0.38" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#2d5680"/>
      <stop offset="0.5" stop-color="#16293f"/>
      <stop offset="1" stop-color="#090f19"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="0.55" stop-color="#b7c8d6"/>
      <stop offset="1" stop-color="#7c90a3"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cddbe8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#f7c748"/>
      <stop offset="1" stop-color="#c88712"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbdc7c"/>
      <stop offset="1" stop-color="#b3740c"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1c44a"/>
    </radialGradient>
    <radialGradient id="ruby" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff9a8f"/>
      <stop offset="1" stop-color="#a61f17"/>
    </radialGradient>
    <radialGradient id="sapphire" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#1d63a6"/>
    </radialGradient>
  </defs>

  <!-- disc: soft outer edge (reads on light tabs too), deep navy face, silver rim with a light edge -->
  <circle cx="32" cy="36" r="26.6" fill="#050910" opacity="0.35"/>
  <circle cx="32" cy="36" r="25" fill="url(#disc)"/>
  <circle cx="32" cy="36" r="23.6" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.8"/>
  <circle cx="32" cy="36" r="25" fill="none" stroke="url(#ring)" stroke-width="2.4"/>
  <path d="M10.76 28.27 A22.6 22.6 0 0 1 40.47 15.05" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round"/>

  <!-- piston linkage, after Steam's mark: a rod tapering into the big joint -->
  <g fill="#000" opacity="0.35" transform="translate(0.7 1.2)">
    <path d="M22.97 49.14 L42.4 33.69 L37.6 28.31 L20.03 45.86 Z"/>
    <circle cx="40" cy="31" r="9.8"/>
    <circle cx="21.5" cy="47.5" r="5.9"/>
  </g>
  <path d="M22.97 49.14 L42.4 33.69 L37.6 28.31 L20.03 45.86 Z" fill="url(#metal)"/>
  <circle cx="40" cy="31" r="8.2" fill="#0b1524" stroke="url(#metal)" stroke-width="3.2"/>
  <circle cx="40" cy="31" r="3.4" fill="url(#metal)"/>
  <circle cx="21.5" cy="47.5" r="4.6" fill="#0b1524" stroke="url(#metal)" stroke-width="2.6"/>

  <!-- KING crown, worn at an angle: its band sinks into the rim -->
  <g transform="translate(19.47 17.43) rotate(-34) scale(0.62)">
    <path d="M-14.2 -6.2 L-17.6 -19.4 L-8.6 -12.4 L0 -23.6 L8.6 -12.4 L17.6 -19.4 L14.2 -6.2 Q0 -3.4 -14.2 -6.2 Z" fill="url(#gold)" stroke="#7a4d0b" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M0 -23.6 L-8.6 -12.4 L-14.2 -6.2 Q-7 -4.8 0 -4.6 Z" fill="#fff" opacity="0.22"/>
    <path d="M-15.2 -6.9 Q0 -3.8 15.2 -6.9 L15.2 -1.2 Q0 1.9 -15.2 -1.2 Z" fill="url(#band)" stroke="#7a4d0b" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M-13.4 -5.6 Q0 -2.9 13.4 -5.6" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="-17.6" cy="-19.4" r="2.2" fill="url(#pearl)" stroke="#9a650c" stroke-width="0.5"/>
    <circle cx="0" cy="-23.6" r="2.5" fill="url(#pearl)" stroke="#9a650c" stroke-width="0.5"/>
    <circle cx="17.6" cy="-19.4" r="2.2" fill="url(#pearl)" stroke="#9a650c" stroke-width="0.5"/>
    <circle cx="-8.5" cy="-2.9" r="1.15" fill="url(#sapphire)"/>
    <circle cx="8.5" cy="-2.9" r="1.15" fill="url(#sapphire)"/>
    <path d="M0 -4.4 L1.6 -2.4 L0 -0.3999999999999999 L-1.6 -2.4 Z" fill="url(#ruby)" stroke="#6b120d" stroke-width="0.4"/>
  </g>
</svg>
