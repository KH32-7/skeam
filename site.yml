# 홈 화면 "특집 및 추천" 캐러셀: 모든 게임이 방문할 때마다 무작위 순서로 나옵니다.
# 항상 맨 앞에 고정하고 싶은 게임이 있으면 여기에 id를 적으세요. 예: featured: [celrush]
featured: []

# 운영자 추천: 홈 "운영자 추천" 칸(최대 4개)과 캐러셀, 게임 페이지에 추천 한마디가 붙습니다.
# 예:
# picks:
#   - id: celrush
#     note: "만화책 속을 달리는 느낌이 끝내줘요. 보트 코스 꼭 해 보세요"
picks: []

# 운영자 SKEAM 닉네임: 로그인하면 열린 PR 알림을 받고, 등록 도우미에서 모든 게임을 고칠 수 있습니다.
# 맨 앞 사람이 '운영자 추천'에 이름으로 나옵니다.
admins: [KH327, gamzuha]

# 게임 PR 자동 머지: 새 게임은 누구나, 이미 있는 게임은 그 게임의 GitHub 계정,
# 레포 주인, 그리고 아래 계정이 보낸 PR만 검사 통과 시 자동으로 머지됩니다.
# (아래 계정은 다른 사람 게임도 고칠 수 있어요.)
trusted_github: [Gammja17]

# 무조건 자동 머지: 레포 주인과 아래 GitHub 계정이 보낸 PR은 어떤 파일을 바꾸든 바로 머지됩니다.
# (초안(draft) PR은 머지되지 않아요. .github/workflows 파일을 바꾸는 PR은 GitHub가 막아서 직접 머지해야 해요.)
auto_merge_github: [Gammja17]
